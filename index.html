<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Welcome to My Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Satisfy&family=Syne:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- APP ROOT -->
  <div id="app" class="app-root">

    <!-- EDITORIAL BACKGROUND GRAPHIC LAYER -->
    <div class="editorial-bg-layer" aria-hidden="true">
      <!-- 3 Vertical Green Stripes Running Down Behind Title -->
      <div class="accent-stripes-group">
        <div class="stripe stripe-1"></div>
        <div class="stripe stripe-2"></div>
        <div class="stripe stripe-3"></div>
      </div>

      <!-- Subtle background typography watermark -->
      <div class="bg-watermark">ZENLYGO</div>

      <!-- Grid Crosshairs (+) with corner labels -->
      <div class="grid-cross gc-tl"><span>+</span></div>
      <div class="grid-cross gc-tr"><span>+</span></div>
      <div class="grid-cross gc-bl"><span>+</span><label>SEC.B</label></div>
      <div class="grid-cross gc-br"><span>+</span><label>SPEC.26</label></div>

      <!-- Left Flank Editorial Graphic: Ruler ticks -->
      <div class="flank-left">
        <div class="flank-ruler">
          <span class="tick t-long"></span><span class="tick"></span><span class="tick"></span>
          <span class="tick t-long"></span><span class="tick"></span><span class="tick"></span>
          <span class="tick t-long"></span>
        </div>
      </div>

      <!-- Right Flank Editorial Graphic: Clean Status Badge -->
      <div class="flank-right">
        <div class="status-pill">
          <span class="status-pulse-dot"></span>
          <span class="status-txt">ONLINE // READY</span>
        </div>
      </div>
    </div>

    <!-- MAIN PROFILE VIEW -->
    <section id="view-home" class="view active">

      <!-- HEADER WITH TITLE -->
      <header class="site-header">
        
        <!-- Top header row: Clean, minimal spacer -->
        <div class="header-top-row">
          <div class="header-corner-spacer"></div>
          <div class="header-corner-spacer"></div>
        </div>

        <!-- MAIN TITLE: ZENLYGO -->
        <div class="main-title-wrap">
          <div class="main-title">
            <h1 class="title-main">ZENLYGO</h1>
          </div>
        </div>

        <!-- Submeta row: Clean Creation Date -->
        <div class="header-meta">
          <div class="meta-left"></div>
          <div class="meta-right">
            <span>1/11/2026</span>
            <span class="meta-dot"></span>
          </div>
        </div>

      </header>

      <!-- SEPARATED STAGE / CARDS TURNTABLE DECK WITH AMPLE SPACE FROM TITLE -->
      <main class="stage" id="main-stage">

        <!-- Aesthetic Green Gradient Pedestal Dome at Bottom -->
        <div class="dial-wrap" aria-hidden="true">
          <div class="green-pedestal-circle"></div>
        </div>

        <div class="deck-wrap" id="main-deck-wrap">
          <div class="deck" id="main-deck">

            <!-- CARD 1: WHATSAPP -->
            <div class="card card-wa" data-type="link" data-url="https://wa.me/6285796984188">

                    <circle cx="75.9" cy="24.1" r="5.8"/>
                  </svg>
                </div>
                <div class="card-tag">OPEN INSTAGRAM</div>
              </div>
            </div>

            <!-- CARD 3: GITHUB -->
            <div class="card card-gh" data-type="link" data-url="https://github.com/clonezone123">
              <div class="card-in">
                <div class="shine"></div>
                <div class="card-logo">

              </div>
            </div>

            <!-- CARD 4: PINTEREST -->
            <div class="card card-pt" data-type="link" data-url="https://pin.it/2HPCWobff">
              <div class="card-in">
                <div class="shine"></div>
                <div class="card-logo">

              <div class="card-in">
                <div class="shine"></div>
                <div class="card-logo">

            <!-- CARD 7: DONATE (FOTO BARCODE & DIBAWAH TULISAN donate to support me) -->
            <div class="card card-donate" data-type="modal-donate">
              <div class="card-in card-donate-in">
                <div class="shine"></div>
                <div class="donate-card-body">
                  <!-- Foto Barcode QR Code -->
                  <div class="donate-qr-frame">
                    <img src="donate-qr.png" alt="Donate Barcode QR" class="donate-qr-img" />
                  </div>
                  <!-- Tulisan persis di bawah barcode: donate to support me -->

    </section>

    <!-- DONATE QR MODAL POPUP -->
    <div id="donate-modal" class="donate-modal-overlay">
      <div class="donate-modal-card">
        <header class="donate-modal-header">
          <div class="donate-modal-badge">
            <span class="donate-pulse-dot"></span>
            <span>SUPPORT CREATOR</span>
          </div>
          <button id="btn-close-donate" class="btn-close-modal" aria-label="Close Donate Modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </header>

        <div class="donate-modal-body">
          <div class="modal-qr-frame">
            <img src="donate-qr.png" alt="Full Donate QR Code" class="modal-qr-img" />
          </div>
          <p class="modal-donate-caption">donate to support me</p>
          <span class="modal-subtext">Scan QR code using any e-wallet or banking app</span>
        </div>
      </div>
    </div>
